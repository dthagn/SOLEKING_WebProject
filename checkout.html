<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thanh toán đơn hàng tại SOLEKING - Giày thể thao chính hãng Nike, Adidas, Puma.">
  <title>Thanh Toán | SOLEKING</title>

  <!-- Liên kết các file CSS chuẩn -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/payment.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <!-- PHẦN ĐẦU TRANG -->
  <header class="header">
    <div class="header-main">
      <div class="header-content">
        <a href="index.html" class="logo">SOLEKING</a>
        <nav class="navbar">
          <a href="index.html" class="nav-link">Trang Chủ</a>
          <a href="product.html" class="nav-link">Shop</a>
          <a href="about.html" class="nav-link">Giới Thiệu</a>
          <a href="contact.html" class="nav-link">Liên Hệ</a>
        </nav>
        <div class="header-actions">
          <a href="#" class="btn-action" title="Tìm Kiếm" id="btn-tim-kiem">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </a>
          <div id="wrapper-tai-khoan">
            <a href="#" class="btn-action" title="Tài Khoản" id="btn-tai-khoan" onclick="toggleDropdownUser(event)">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </a>
            <div class="dropdown-tai-khoan" id="dropdown-tai-khoan"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="checkout-page">
    <div>
      <p class="checkout-subtitle">Hoàn tất đơn hàng</p>
      <h1 class="checkout-title">Thanh Toán</h1>

      <div class="checkout-form-wrapper">
        <h2 class="form-section-title" style="margin-top: 0;">Thông tin giao hàng</h2>
        <div class="form-group">
          <label class="form-label">Họ và tên *</label>
          <input type="text" class="form-input" placeholder="Nguyễn Văn A">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Email *</label>
            <input type="email" class="form-input" placeholder="email@vi-du.com">
          </div>
          <div class="form-group">
            <label class="form-label">Số điện thoại *</label>
            <input type="tel" class="form-input" placeholder="0912 345 678">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Địa chỉ nhận hàng *</label>
          <input type="text" class="form-input" placeholder="Số nhà, tên đường, phường/xã...">
        </div>

        <h2 class="form-section-title">Phương thức thanh toán</h2>
        <div class="payment-methods">
          <label class="payment-option">
            <input type="radio" name="payment" checked>
            <span>Thanh toán khi nhận hàng (COD)</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment">
            <span>Chuyển khoản ngân hàng</span>
          </label>
        </div>

        <button class="btn-submit-order">Đặt hàng ngay</button>
      </div>
    </div>

    <aside class="checkout-cart-wrapper">
      <h2 class="checkout-cart-title">
        Đơn hàng của bạn
        <span class="cart-item-count" id="so-luong-tt">0 sản phẩm</span>
      </h2>
      <div id="cart-list">
        <!-- Rendered by cart.js -->
        <div class="cart-empty">Giỏ hàng đang trống</div>
      </div>

      <div class="cart-summary">
        <div class="summary-row">
          <span>Tạm tính</span>
          <span id="tam-tinh-tt">0đ</span>
        </div>
        <div class="summary-row">
          <span>Phí vận chuyển</span>
          <span class="tag-free">Miễn phí</span>
        </div>
        <div class="summary-row summary-total">
          <span>Tổng cộng</span>
          <span id="tong-cong-tt">0đ</span>
        </div>
      </div>
    </aside>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
