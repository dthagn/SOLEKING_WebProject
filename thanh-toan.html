<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thanh toán đơn hàng tại SOLEKING - Giày thể thao chính hãng Nike, Adidas, Puma.">
  <title>Thanh Toán | SOLEKING</title>

  <!-- Liên kết các file CSS chuẩn -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/payment.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <!-- PHẦN ĐẦU TRANG -->
  <header class="phan-dau">
    <div class="phan-dau-chinh">
      <div class="noi-dung-phan-dau">
        <a href="index.html" class="logo">SOLEKING</a>
        <nav class="thanh-dieu-huong">
          <a href="index.html" class="lien-ket-dieu-huong">Trang Chủ</a>
          <a href="san-pham.html" class="lien-ket-dieu-huong">Shop</a>
          <a href="gioi-thieu.html" class="lien-ket-dieu-huong">Giới Thiệu</a>
          <a href="lien-he.html" class="lien-ket-dieu-huong">Liên Hệ</a>
        </nav>
        <div class="hanh-dong">
          <a href="#" class="nut-hanh-dong" title="Tìm Kiếm" id="btn-tim-kiem">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </a>
          <div id="wrapper-tai-khoan">
            <a href="#" class="nut-hanh-dong" title="Tài Khoản" id="btn-tai-khoan" onclick="toggleDropdownUser(event)">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </a>
            <div class="dropdown-tai-khoan" id="dropdown-tai-khoan"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="trang-thanh-toan">
    <div>
      <p class="tieu-de-trang-tt">Hoàn tất đơn hàng</p>
      <h1 class="tieu-de-chinh-tt">Thanh Toán</h1>

      <div class="khung-form-tt">
        <h2 class="tieu-de-phan-form" style="margin-top: 0;">Thông tin giao hàng</h2>
        <div class="nhom-form-tt">
          <label class="nhan-form-tt">Họ và tên *</label>
          <input type="text" class="o-form-tt" placeholder="Nguyễn Văn A">
        </div>
        <div class="hang-form-tt">
          <div class="nhom-form-tt">
            <label class="nhan-form-tt">Email *</label>
            <input type="email" class="o-form-tt" placeholder="email@vi-du.com">
          </div>
          <div class="nhom-form-tt">
            <label class="nhan-form-tt">Số điện thoại *</label>
            <input type="tel" class="o-form-tt" placeholder="0912 345 678">
          </div>
        </div>
        <div class="nhom-form-tt">
          <label class="nhan-form-tt">Địa chỉ nhận hàng *</label>
          <input type="text" class="o-form-tt" placeholder="Số nhà, tên đường, phường/xã...">
        </div>

        <h2 class="tieu-de-phan-form">Phương thức thanh toán</h2>
        <div class="phuong-thuc-tt">
          <label class="tuy-chon-tt">
            <input type="radio" name="payment" checked>
            <span>Thanh toán khi nhận hàng (COD)</span>
          </label>
          <label class="tuy-chon-tt">
            <input type="radio" name="payment">
            <span>Chuyển khoản ngân hàng</span>
          </label>
        </div>

        <button class="nut-xac-nhan-tt">Đặt hàng ngay</button>
      </div>
    </div>

    <aside class="khung-gio-hang-tt">
      <h2 class="tieu-de-gio-tt">
        Đơn hàng của bạn
        <span class="so-sp-gio" id="so-luong-tt">0 sản phẩm</span>
      </h2>
      <div id="danh-sach-gio">
        <!-- Rendered by cart.js -->
        <div class="gio-trong">Giỏ hàng đang trống</div>
      </div>

      <div class="tong-ket-gio">
        <div class="dong-tong-ket">
          <span>Tạm tính</span>
          <span id="tam-tinh-tt">0đ</span>
        </div>
        <div class="dong-tong-ket">
          <span>Phí vận chuyển</span>
          <span class="mien-phi-tag">Miễn phí</span>
        </div>
        <div class="dong-tong-ket tong-cuoi">
          <span>Tổng cộng</span>
          <span id="tong-cong-tt">0đ</span>
        </div>
      </div>
    </aside>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
